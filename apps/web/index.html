      // aplica o tema salvo antes do primeiro paint (evita flash)
      try {
        var t = localStorage.getItem('lc-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
